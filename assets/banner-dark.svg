<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Andrea Fernández</title>
  <desc id="desc">Monitor retro que muestra: Andrea Fernández, estudiante de ingeniería en sistemas, Resistencia, Chaco, Argentina.</desc>

  <defs>
    <!-- Carcasa del monitor -->
    <linearGradient id="carcasa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202327"/>
      <stop offset="1" stop-color="#131518"/>
    </linearGradient>

    <!-- Pantalla: más clara al centro, oscura en los bordes -->
    <radialGradient id="pantalla" cx="0.4" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1b2e3e"/>
      <stop offset="0.65" stop-color="#0c141c"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>

    <!-- Líneas de barrido -->
    <pattern id="barrido" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.32"/>
    </pattern>

    <!-- Banda de luz que baja por la pantalla -->
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c4dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a9c4dc" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a9c4dc" stop-opacity="0"/>
    </linearGradient>

    <!-- Matriz de puntos rojos -->
    <pattern id="puntos" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.6" fill="#e5484d"/>
    </pattern>
    <linearGradient id="desvanecer" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="mascara-puntos">
      <rect x="704" y="68" width="208" height="224" fill="url(#desvanecer)"/>
    </mask>

    <!-- Brillo del fósforo -->
    <filter id="brillo" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="difuso"/>
      <feMerge>
        <feMergeNode in="difuso"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="recorte-pantalla">
      <rect x="40" y="36" width="920" height="290" rx="28"/>
    </clipPath>

    <style>
      .texto { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace; fill: #a9c4dc; }
      .tenue { fill-opacity: 0.7; }
      .cursor { animation: titilar 1.1s steps(1) infinite; }
      .banda { animation: bajar 7s linear infinite; }
      .puntos { animation: latir 4s ease-in-out infinite; }
      .led { animation: latir 3s ease-in-out infinite; }
      .fosforo { animation: parpadeo 9s linear infinite; }
      @keyframes titilar { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes bajar { from { transform: translateY(-80px); } to { transform: translateY(330px); } }
      @keyframes latir { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @keyframes parpadeo { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.82; } 98% { opacity: 1; } 99% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .banda, .puntos, .led, .fosforo { animation: none; }
      }
    </style>
  </defs>

  <!-- Carcasa -->
  <rect x="10" y="10" width="980" height="360" rx="40" fill="url(#carcasa)" stroke="#2c3035" stroke-width="1.5"/>
  <rect x="32" y="28" width="936" height="306" rx="34" fill="#0b0d0f"/>

  <!-- Pantalla -->
  <rect x="40" y="36" width="920" height="290" rx="28" fill="url(#pantalla)"/>

  <g clip-path="url(#recorte-pantalla)">
    <!-- Texto -->
    <g class="fosforo" filter="url(#brillo)">
      <text class="texto tenue" x="84" y="92" font-size="17">andrea@resistencia:~$ whoami</text>
      <text class="texto" x="82" y="152" font-size="42" font-weight="700">Andrea Fernández</text>
      <text class="texto" x="84" y="196" font-size="18">estudiante de ingeniería en sistemas</text>
      <text class="texto" x="84" y="226" font-size="18">resistencia, chaco — argentina</text>
      <text class="texto tenue" x="84" y="284" font-size="17">andrea@resistencia:~$ <tspan class="cursor" fill-opacity="1">█</tspan></text>
    </g>

    <!-- Puntos rojos -->
    <g class="puntos">
      <rect x="704" y="68" width="208" height="224" fill="url(#puntos)" mask="url(#mascara-puntos)"/>
    </g>

    <!-- Líneas de barrido, banda de luz y reflejo -->
    <rect x="40" y="36" width="920" height="290" fill="url(#barrido)"/>
    <rect class="banda" x="40" y="36" width="920" height="80" fill="url(#banda)"/>
    <ellipse cx="260" cy="70" rx="260" ry="60" fill="#ffffff" fill-opacity="0.025"/>
  </g>

  <!-- Detalles de la carcasa -->
  <text x="64" y="354" font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="3" fill="#4a4f55">RESISTENCIA · CHACO</text>
  <circle class="led" cx="936" cy="351" r="3.5" fill="#e5484d"/>
  <circle cx="936" cy="351" r="7" fill="#e5484d" fill-opacity="0.15"/>
</svg>
